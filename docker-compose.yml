# Local development orchestration for the ASA backend.
# Brings up PostgreSQL, the Django app and the Bale bot. Media is stored on the
# local filesystem (served by Django at /media in DEBUG) to keep dev simple and
# avoid extra ports. To exercise S3 parity instead, run a MinIO container and set
# the web service's USE_S3=true + AWS_* env (see git history for the MinIO config).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-asa}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host 5433 -> container 5432 (avoids clashing with a host PostgreSQL on 5432).
      # Containers still reach the DB at db:5432 over the internal network.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-asa}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        APT_MIRROR: ${APT_MIRROR:-https://deb.debian.org}
    command: >
      /bin/sh -c "
      python manage.py migrate --noinput &&
      python manage.py runserver 0.0.0.0:8000
      "
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_DEBUG: "true"
      # "web" is needed so the bot (which posts to http://web:8000) passes the
      # ALLOWED_HOSTS check; the others cover browser/proxy + healthcheck access.
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,web"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-dev-key}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-asa}
      # Local filesystem media in dev (served at /media). No object store required.
      USE_S3: "false"
      SMS_BACKEND: console
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    healthcheck:
      # Hits a public endpoint once migrations have run and the server is up.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/public/config/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy

  bot:
    profiles: ["bot"]
    build:
      context: .
      dockerfile: bot/Dockerfile
      network: ${DOCKER_BUILD_NETWORK:-default}
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    environment:
      BALE_BOT_TOKEN: ${BALE_BOT_TOKEN:-}
      BACKEND_API_URL: http://web:8000/api
      CEO_CARD_NUMBER: ${CEO_CARD_NUMBER:-6037-9900-0000-0000}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
